<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container mt-4">
  <h3 class="fw-bold mb-4">Checkout</h3>
  <div class="row g-4">
    <div class="col-md-8">
      <div class="card-soft p-4 mb-3">
        <h6 class="fw-bold mb-3">Delivery Address</h6>
        <div id="saved-addresses" class="mb-3"></div>
        <form id="checkout-form" class="row g-3">
          <div class="col-md-6"><input class="form-control" id="full_name" placeholder="Full Name" required></div>
          <div class="col-md-6"><input class="form-control" id="phone" placeholder="Phone" required></div>
          <div class="col-12"><input class="form-control" id="email" type="email" placeholder="Email" required></div>
          <div class="col-12"><input class="form-control" id="address_line" placeholder="Address" required></div>
          <div class="col-md-4"><input class="form-control" id="city" placeholder="City" required></div>
          <div class="col-md-4"><input class="form-control" id="state" placeholder="State" required></div>
          <div class="col-md-4"><input class="form-control" id="pincode" placeholder="Pincode" required></div>
        </form>
      </div>

      <div class="card-soft p-4">
        <h6 class="fw-bold mb-3">Payment Method</h6>
        <div class="d-flex flex-column gap-2">
          <label class="d-flex align-items-center gap-2"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label>
          <label class="d-flex align-items-center gap-2"><input type="radio" name="payment" value="upi"> UPI (Demo)</label>
          <label class="d-flex align-items-center gap-2"><input type="radio" name="payment" value="razorpay"> Razorpay</label>
          <label class="d-flex align-items-center gap-2"><input type="radio" name="payment" value="stripe"> Stripe</label>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card-soft summary-card p-3">
        <h6 class="fw-bold mb-3">Order Summary</h6>
        <div class="d-flex justify-content-between small mb-1"><span>Subtotal</span><span id="s-subtotal">₹0</span></div>
        <div class="d-flex justify-content-between small mb-1 text-success"><span>Discount</span><span id="s-discount">−₹0</span></div>
        <div class="d-flex justify-content-between small mb-1"><span>Delivery</span><span id="s-delivery">₹0</span></div>
        <div class="d-flex justify-content-between small mb-1"><span>GST (18%)</span><span id="s-gst">₹0</span></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold mb-3"><span>Grand Total</span><span id="s-total">₹0</span></div>
        <button class="btn btn-accent w-100" onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar();
renderFooter();

let cartSummary = null;

async function init() {
  if (!requireLogin("Please log in to checkout")) return;

  try {
    const cart = await Api.getCart();
    if (!cart.items.length) {
      toast("Your cart is empty", true);
      setTimeout(() => (window.location.href = "cart.html"), 800);
      return;
    }
    cartSummary = cart;
    renderSummary(cart);
  } catch (e) { toast(e.message, true); }

  try {
    const user = Api.currentUser();
    if (user) {
      document.getElementById("full_name").value = user.name;
      document.getElementById("email").value = user.email;
      if (user.phone) document.getElementById("phone").value = user.phone;
    }
    const addresses = await Api.listAddresses();
    if (addresses.length) {
      document.getElementById("saved-addresses").innerHTML = addresses.map(a => `
        <button type="button" class="btn btn-sm btn-outline-brand me-2 mb-2" onclick='fillAddress(${JSON.stringify(a)})'>
          ${a.city}, ${a.pincode}
        </button>`).join("");
    }
  } catch (e) { /* ignore */ }
}

function fillAddress(a) {
  document.getElementById("full_name").value = a.full_name;
  document.getElementById("phone").value = a.phone;
  document.getElementById("address_line").value = a.line1;
  document.getElementById("city").value = a.city;
  document.getElementById("state").value = a.state;
  document.getElementById("pincode").value = a.pincode;
}

function renderSummary(cart) {
  document.getElementById("s-subtotal").textContent = formatCurrency(cart.subtotal);
  document.getElementById("s-discount").textContent = "−" + formatCurrency(cart.discount);
  document.getElementById("s-delivery").textContent = cart.delivery_charge === 0 ? "FREE" : formatCurrency(cart.delivery_charge);
  document.getElementById("s-gst").textContent = formatCurrency(cart.gst_amount);
  document.getElementById("s-total").textContent = formatCurrency(cart.grand_total);
}

async function placeOrder() {
  const form = document.getElementById("checkout-form");
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  try {
    const order = await Api.checkout({
      full_name: document.getElementById("full_name").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      address_line: document.getElementById("address_line").value,
      city: document.getElementById("city").value,
      state: document.getElementById("state").value,
      pincode: document.getElementById("pincode").value,
      payment_method: paymentMethod,
    });
    toast(`Order ${order.order_number} placed! 🎉`);
    updateBadges();
    setTimeout(() => (window.location.href = `orders.html?highlight=${order.id}`), 900);
  } catch (e) { toast(e.message, true); }
}

init();
</script>
</body>
</html>
