<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container mt-4">
  <h3 class="fw-bold mb-4">Your Cart</h3>
  <div class="row g-4">
    <div class="col-md-8" id="cart-items"></div>
    <div class="col-md-4">
      <div class="card-soft summary-card p-3">
        <h6 class="fw-bold mb-3">Order Summary</h6>
        <div class="d-flex gap-2 mb-3">
          <input class="form-control form-control-sm" id="coupon-code" placeholder="Coupon code (e.g. WELCOME10)">
          <button class="btn btn-outline-brand btn-sm" onclick="applyCoupon()">Apply</button>
        </div>
        <div class="d-flex justify-content-between small mb-1"><span>Subtotal</span><span id="s-subtotal">₹0</span></div>
        <div class="d-flex justify-content-between small mb-1 text-success"><span>Discount</span><span id="s-discount">−₹0</span></div>
        <div class="d-flex justify-content-between small mb-1"><span>Delivery</span><span id="s-delivery">₹0</span></div>
        <div class="d-flex justify-content-between small mb-1"><span>GST (18%)</span><span id="s-gst">₹0</span></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold mb-3"><span>Grand Total</span><span id="s-total">₹0</span></div>
        <button class="btn btn-accent w-100" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar();
renderFooter();

function updateSummary(cart) {
  document.getElementById("s-subtotal").textContent = formatCurrency(cart.subtotal);
  document.getElementById("s-discount").textContent = "−" + formatCurrency(cart.discount);
  document.getElementById("s-delivery").textContent = cart.delivery_charge === 0 ? "FREE" : formatCurrency(cart.delivery_charge);
  document.getElementById("s-gst").textContent = formatCurrency(cart.gst_amount);
  document.getElementById("s-total").textContent = formatCurrency(cart.grand_total);
  sessionStorage.setItem("shopai_cart_summary", JSON.stringify(cart));
}

function renderCartItems(cart) {
  const el = document.getElementById("cart-items");
  if (!cart.items.length) {
    el.innerHTML = `<div class="card-soft p-5 text-center text-muted">Your cart is empty. <a href="products.html">Browse products →</a></div>`;
    return;
  }
  el.innerHTML = cart.items.map(item => `
    <div class="card-soft p-3 mb-3 d-flex flex-row gap-3 align-items-center">
      <img src="${firstImage(item.product.image_urls)}" style="width:80px;height:80px;object-fit:cover;border-radius:10px">
      <div class="flex-grow-1">
        <a href="product_details.html?id=${item.product_id}" class="text-dark fw-semibold text-decoration-none">${item.product.name}</a>
        <div class="fw-bold">${formatCurrency(item.product.price)}</div>
        <div class="qty-control mt-2">
          <button onclick="updateQty(${item.id}, ${item.quantity - 1})">−</button>
          <span>${item.quantity}</span>
          <button onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})">Remove</button>
    </div>`).join("");
}

async function loadCart() {
  if (!requireLogin("Please log in to view your cart")) return;
  try {
    const cart = await Api.getCart();
    renderCartItems(cart);
    updateSummary(cart);
  } catch (e) { toast(e.message, true); }
}

async function updateQty(itemId, qty) {
  if (qty < 1) return removeItem(itemId);
  try {
    const cart = await Api.updateCartItem(itemId, qty);
    renderCartItems(cart);
    updateSummary(cart);
    updateBadges();
  } catch (e) { toast(e.message, true); }
}

async function removeItem(itemId) {
  try {
    const cart = await Api.removeCartItem(itemId);
    renderCartItems(cart);
    updateSummary(cart);
    updateBadges();
    toast("Item removed");
  } catch (e) { toast(e.message, true); }
}

async function applyCoupon() {
  const code = document.getElementById("coupon-code").value.trim();
  if (!code) return;
  try {
    const cart = await Api.applyCoupon(code);
    updateSummary(cart);
    toast("Coupon applied!");
  } catch (e) { toast(e.message, true); }
}

loadCart();
</script>
</body>
</html>
