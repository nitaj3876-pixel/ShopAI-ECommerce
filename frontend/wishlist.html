<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container mt-4">
  <h3 class="fw-bold mb-4">My Wishlist</h3>
  <div class="row g-3" id="wishlist-grid"></div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar();
renderFooter();

function wishlistCardHtml(item) {
  const p = item.product;
  return `
  <div class="col-6 col-md-4 col-lg-3">
    <div class="card-soft product-card">
      <a href="product_details.html?id=${p.id}"><img src="${firstImage(p.image_urls)}" alt="${p.name}"></a>
      <div class="body">
        <div class="fw-semibold mb-1" style="font-size:.92rem; min-height:2.4em;">${p.name}</div>
        <div class="price mb-2">${formatCurrency(p.price)}</div>
        <div class="d-flex gap-2 mt-auto">
          <button class="btn btn-brand btn-sm flex-grow-1" onclick="moveToCart(${p.id})">Move to Cart</button>
          <button class="btn btn-outline-danger btn-sm" onclick="removeWishlist(${p.id})">✕</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function loadWishlist() {
  if (!requireLogin("Please log in to view your wishlist")) return;
  try {
    const items = await Api.getWishlist();
    const el = document.getElementById("wishlist-grid");
    if (!items.length) {
      el.innerHTML = `<div class="col-12"><div class="card-soft p-5 text-center text-muted">Your wishlist is empty. <a href="products.html">Browse products →</a></div></div>`;
      return;
    }
    el.innerHTML = items.map(wishlistCardHtml).join("");
  } catch (e) { toast(e.message, true); }
}

async function moveToCart(productId) {
  try {
    await Api.moveToCart(productId);
    toast("Moved to cart!");
    updateBadges();
    loadWishlist();
  } catch (e) { toast(e.message, true); }
}

async function removeWishlist(productId) {
  try {
    await Api.removeFromWishlist(productId);
    toast("Removed from wishlist");
    updateBadges();
    loadWishlist();
  } catch (e) { toast(e.message, true); }
}

loadWishlist();
</script>
</body>
</html>
