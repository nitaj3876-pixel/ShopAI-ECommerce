<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container">
  <div class="card-soft auth-card">
    <h3 class="fw-bold mb-1">Forgot your password?</h3>
    <p class="text-muted mb-4">Enter your email and we'll send you a reset link.</p>
    <div id="msg-box" class="alert d-none"></div>

    <form id="forgot-form">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <button type="submit" class="btn btn-brand w-100">Send Reset Link</button>
    </form>

    <hr class="my-4">
    <p class="small text-muted">Demo mode: no real email is sent. Paste the token you receive below to reset your password directly.</p>
    <form id="reset-form">
      <div class="mb-2">
        <input type="text" class="form-control form-control-sm" id="reset-token" placeholder="Reset token">
      </div>
      <div class="mb-2">
        <input type="password" class="form-control form-control-sm" id="new-password" placeholder="New password" minlength="6">
      </div>
      <button type="submit" class="btn btn-outline-brand btn-sm w-100">Reset Password</button>
    </form>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar();
renderFooter();

function showMsg(text, ok = true) {
  const box = document.getElementById("msg-box");
  box.textContent = text;
  box.className = `alert ${ok ? "alert-success" : "alert-danger"}`;
}

document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const res = await Api.forgotPassword(document.getElementById("email").value);
    showMsg(res.message + (res.demo_token ? ` (demo token: ${res.demo_token})` : ""));
    if (res.demo_token) document.getElementById("reset-token").value = res.demo_token;
  } catch (err) {
    showMsg(err.message, false);
  }
});

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const res = await Api.resetPassword({
      token: document.getElementById("reset-token").value,
      new_password: document.getElementById("new-password").value,
    });
    showMsg(res.message + " You can now log in.");
  } catch (err) {
    showMsg(err.message, false);
  }
});
</script>
</body>
</html>
