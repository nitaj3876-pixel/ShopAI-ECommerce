<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container">
  <div class="card-soft auth-card">
    <h3 class="fw-bold mb-1">Create your account</h3>
    <p class="text-muted mb-4">Join ShopAI for personalized recommendations</p>
    <div id="register-error" class="alert alert-danger d-none"></div>
    <form id="register-form">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full Name</label>
        <input type="text" class="form-control" id="name" required minlength="2">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Phone</label>
        <input type="tel" class="form-control" id="phone">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control" id="password" required minlength="6">
        <div class="form-text">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-brand w-100">Create Account</button>
    </form>
    <p class="text-center mt-4 mb-0 small">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar();
renderFooter();

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("register-error");
  errorBox.classList.add("d-none");
  try {
    const res = await Api.register({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value || null,
      password: document.getElementById("password").value,
    });
    Api.setToken(res.access_token);
    Api.setUser(res.user);
    toast(`Welcome to ShopAI, ${res.user.name.split(" ")[0]}!`);
    setTimeout(() => (window.location.href = "index.html"), 500);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
