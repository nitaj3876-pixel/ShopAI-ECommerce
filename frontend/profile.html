<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container mt-4">
  <div class="row g-4">
    <div class="col-md-3">
      <div class="card-soft p-3">
        <div class="nav flex-column nav-pills" id="profile-tabs">
          <button class="nav-link active text-start" data-tab="profile-tab">👤 Profile</button>
          <button class="nav-link text-start" data-tab="addresses-tab">📍 Saved Addresses</button>
          <button class="nav-link text-start" data-tab="password-tab">🔒 Change Password</button>
          <button class="nav-link text-start" data-tab="notifications-tab">🔔 Notifications</button>
          <button class="nav-link text-start" data-tab="orders-tab" onclick="window.location.href='orders.html'">📦 Order History</button>
          <button class="nav-link text-start" data-tab="wishlist-tab" onclick="window.location.href='wishlist.html'">❤️ Wishlist</button>
        </div>
      </div>
    </div>

    <div class="col-md-9">
      <div class="tab-pane" id="profile-tab">
        <div class="card-soft p-4">
          <h5 class="fw-bold mb-3">Edit Profile</h5>
          <form id="profile-form" class="row g-3">
            <div class="col-md-6"><label class="small fw-semibold">Name</label><input class="form-control" id="p-name"></div>
            <div class="col-md-6"><label class="small fw-semibold">Email</label><input class="form-control" id="p-email" disabled></div>
            <div class="col-md-6"><label class="small fw-semibold">Phone</label><input class="form-control" id="p-phone"></div>
            <div class="col-12"><button class="btn btn-brand">Save Changes</button></div>
          </form>
        </div>
      </div>

      <div class="tab-pane d-none" id="addresses-tab">
        <div class="card-soft p-4">
          <h5 class="fw-bold mb-3">Saved Addresses</h5>
          <div id="address-list" class="mb-3"></div>
          <form id="address-form" class="row g-2">
            <div class="col-md-6"><input class="form-control form-control-sm" id="a-name" placeholder="Full name" required></div>
            <div class="col-md-6"><input class="form-control form-control-sm" id="a-phone" placeholder="Phone" required></div>
            <div class="col-12"><input class="form-control form-control-sm" id="a-line1" placeholder="Address line" required></div>
            <div class="col-md-4"><input class="form-control form-control-sm" id="a-city" placeholder="City" required></div>
            <div class="col-md-4"><input class="form-control form-control-sm" id="a-state" placeholder="State" required></div>
            <div class="col-md-4"><input class="form-control form-control-sm" id="a-pincode" placeholder="Pincode" required></div>
            <div class="col-12"><button class="btn btn-brand btn-sm">Add Address</button></div>
          </form>
        </div>
      </div>

      <div class="tab-pane d-none" id="password-tab">
        <div class="card-soft p-4">
          <h5 class="fw-bold mb-3">Change Password</h5>
          <form id="password-form" class="row g-3">
            <div class="col-md-6"><input type="password" class="form-control" id="old-pw" placeholder="Current password" required></div>
            <div class="col-md-6"><input type="password" class="form-control" id="new-pw" placeholder="New password" required minlength="6"></div>
            <div class="col-12"><button class="btn btn-brand">Update Password</button></div>
          </form>
        </div>
      </div>

      <div class="tab-pane d-none" id="notifications-tab">
        <div class="card-soft p-4">
          <h5 class="fw-bold mb-3">Notifications</h5>
          <div id="notification-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar();
renderFooter();

document.querySelectorAll("#profile-tabs [data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#profile-tabs .nav-link").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tab-pane").forEach(p => p.classList.add("d-none"));
    const tab = document.getElementById(btn.dataset.tab);
    if (tab) tab.classList.remove("d-none");
    if (btn.dataset.tab === "addresses-tab") loadAddresses();
    if (btn.dataset.tab === "notifications-tab") loadNotifications();
  });
});

async function init() {
  if (!requireLogin()) return;
  const user = Api.currentUser();
  document.getElementById("p-name").value = user.name;
  document.getElementById("p-email").value = user.email;
  document.getElementById("p-phone").value = user.phone || "";
}

document.getElementById("profile-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const updated = await Api.updateProfile({
      name: document.getElementById("p-name").value,
      phone: document.getElementById("p-phone").value,
    });
    Api.setUser(updated);
    toast("Profile updated!");
  } catch (err) { toast(err.message, true); }
});

document.getElementById("password-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await Api.changePassword({
      old_password: document.getElementById("old-pw").value,
      new_password: document.getElementById("new-pw").value,
    });
    toast("Password changed!");
    e.target.reset();
  } catch (err) { toast(err.message, true); }
});

async function loadAddresses() {
  try {
    const addresses = await Api.listAddresses();
    document.getElementById("address-list").innerHTML = addresses.map(a => `
      <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2">
        <div class="small">${a.full_name}, ${a.line1}, ${a.city}, ${a.state} - ${a.pincode} <br>📞 ${a.phone}</div>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteAddress(${a.id})">Delete</button>
      </div>`).join("") || `<div class="text-muted small">No saved addresses yet.</div>`;
  } catch (e) { toast(e.message, true); }
}

document.getElementById("address-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await Api.addAddress({
      full_name: document.getElementById("a-name").value,
      phone: document.getElementById("a-phone").value,
      line1: document.getElementById("a-line1").value,
      city: document.getElementById("a-city").value,
      state: document.getElementById("a-state").value,
      pincode: document.getElementById("a-pincode").value,
      is_default: false,
    });
    toast("Address added!");
    e.target.reset();
    loadAddresses();
  } catch (err) { toast(err.message, true); }
});

async function deleteAddress(id) {
  try {
    await Api.deleteAddress(id);
    toast("Address removed");
    loadAddresses();
  } catch (e) { toast(e.message, true); }
}

async function loadNotifications() {
  try {
    const items = await Api.listNotifications();
    document.getElementById("notification-list").innerHTML = items.map(n => `
      <div class="border rounded p-2 mb-2 small ${n.is_read ? 'text-muted' : 'fw-semibold'}">${n.message}
        <div class="text-muted" style="font-size:.75rem">${new Date(n.created_at).toLocaleString()}</div>
      </div>`).join("") || `<div class="text-muted small">No notifications yet.</div>`;
  } catch (e) { toast(e.message, true); }
}

init();
</script>
</body>
</html>
