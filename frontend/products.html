<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — ShopAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container mt-4">
  <div class="row g-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <h4 class="fw-bold mb-0" id="results-title">All Products</h4>
          <div class="small text-muted" id="results-count"></div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="small text-muted mb-0">Sort by</label>
          <select class="form-select form-select-sm" id="f-sort" style="width:auto" onchange="loadProducts()">
            <option value="newest">Newest</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
            <option value="rating">Rating</option>
            <option value="popularity">Popularity</option>
          </select>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-brand" id="view-grid" onclick="setView('grid')">▦</button>
            <button class="btn btn-sm btn-outline-brand" id="view-list" onclick="setView('list')">☰</button>
          </div>
        </div>
      </div>

      <div class="row g-3" id="product-grid"></div>
      <div class="text-center mt-4">
        <button class="btn btn-outline-brand" id="load-more-btn" onclick="loadMore()">Load More</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
<script>
renderNavbar("products");
renderFooter();

let currentOffset = 0;
const PAGE_SIZE = 24;
let currentView = "grid";

function getUrlParams() {
  return Object.fromEntries(new URLSearchParams(window.location.search));
}

function initializePage() {
  const params = getUrlParams();
  if (params.search) document.getElementById("navbar-search") && (document.getElementById("navbar-search").value = params.search);
}

function buildQuery(offset = 0) {
  const params = getUrlParams();
  return {
    search: params.search || undefined,
    category_id: params.category_id || undefined,
    brand: params.brand || undefined,
    sort_by: document.getElementById("f-sort").value,
    featured: params.featured || undefined,
    best_seller: params.best_seller || undefined,
    trending: params.trending || undefined,
    flash_sale: params.flash_sale || undefined,
    limit: PAGE_SIZE,
    offset,
  };
}

async function loadProducts() {
  currentOffset = 0;
  const params = getUrlParams();
  document.getElementById("results-title").textContent = params.search ? `Results for "${params.search}"` : "All Products";
  try {
    const products = await Api.listProducts(buildQuery(0));
    renderProductGrid("product-grid", products);
    document.getElementById("results-count").textContent = `${products.length} product(s) shown`;
    document.getElementById("load-more-btn").style.display = products.length < PAGE_SIZE ? "none" : "inline-block";
    currentOffset = products.length;
  } catch (e) {
    toast(e.message, true);
  }
}

async function loadMore() {
  try {
    const products = await Api.listProducts(buildQuery(currentOffset));
    const el = document.getElementById("product-grid");
    el.insertAdjacentHTML("beforeend", products.map(productCardHtml).join(""));
    currentOffset += products.length;
    if (products.length < PAGE_SIZE) document.getElementById("load-more-btn").style.display = "none";
  } catch (e) {
    toast(e.message, true);
  }
}

function setView(view) {
  currentView = view;
  const grid = document.getElementById("product-grid");
  grid.classList.toggle("product-list-view", view === "list");
  document.getElementById("view-grid").classList.toggle("active", view === "grid");
  document.getElementById("view-list").classList.toggle("active", view === "list");
}

(async function () {
  initializePage();
  await loadProducts();
})();
</script>
</body>
</html>
